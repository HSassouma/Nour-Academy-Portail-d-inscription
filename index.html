
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nour Academy</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body class="bg-[#FAF8F2] text-[#1D2924]">

    <!-- Header -->
    <header class="flex justify-between items-center px-6 md:px-12 py-2 bg-[#E6F0E9]">
      <a href="index.html">
        <img
          src="/src/assets/logo.png"
          alt="Nour Academy"
          class="h-[55px]"
        />
      </a>

      <div class="flex gap-6 text-[#174A3A]">
        <i class="fa-solid fa-circle-user text-xl" aria-label="Profil"></i>
        <i class="fa-solid fa-bell text-xl" aria-label="Notifications"></i>
      </div>
    </header>

    <!-- Hero Section -->
    <section
      id="hero_section"
      class="flex flex-col md:flex-row justify-between items-center gap-10 px-6 md:px-12 py-12 md:py-20"
    >
      <div class="intro space-y-5 md:w-1/2">

        <p class="text-sm md:text-base font-semibold text-[#174A3A]">
          SOUTIEN SCOLAIRE · COLLÈGE & LYCÉE
        </p>

        <h1 class="text-4xl md:text-5xl font-bold leading-tight">
          Le bon cours pour réussir.
        </h1>

        <p class="text-lg text-[#65716A] leading-relaxed">
          Des cours en petits groupes, un suivi attentif et une méthode
          pour progresser avec confiance.
        </p>

      </div>
      <div class="filtre w-full md:w-5/12 space-y-5 bg-white p-6 rounded-2xl shadow-sm">

        <h2 class="text-xl font-bold">
          Trouvez le cours qui vous correspond
        </h2>
        <div class="flex items-center gap-3 border border-[#E6F0E9] rounded-xl px-4 py-3">
          <i class="fa-solid fa-magnifying-glass text-[#65716A]" aria-hidden="true"></i>

          <input
            type="search"
            id="recherche"
            name="recherche"
            placeholder="Rechercher un cours..."
            class="w-full outline-none bg-transparent"
          />
        </div>
        <select
          name="niveau"
          id="niveau"
          class="w-full bg-[#E6F0E9] text-[#174A3A] rounded-xl p-3"
        >
          <option value="">Tous les niveaux</option>
          <option value="college">Collège</option>
          <option value="tronc-commun">Tronc commun</option>
          <option value="1bac">1re année Bac</option>
          <option value="2bac">2e année Bac</option>
        </select>
        <select
          name="matiere"
          id="matiere"
          class="w-full bg-[#E6F0E9] text-[#174A3A] rounded-xl p-3"
        >
          <option value="">Toutes les matières</option>
          <option value="mathematiques">Mathématiques</option>
          <option value="physique-chimie">Physique-Chimie</option>
          <option value="francais">Français</option>
          <option value="anglais">Anglais</option>
          <option value="svt">SVT</option>
          <option value="philosophie">Philosophie</option>
        </select>

        <p class="text-sm text-[#65716A]">
          Tous les niveaux, de la 1re année collège à la 2e année bac.
        </p>

      </div>

    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
